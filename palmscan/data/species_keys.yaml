# Canonical species-key registry (SCAN-002). One list for palmscan normalization, the
# ARCH-002 species pattern and palmcore.assets manifest validation (ASSET-005, by path).
# Add a species here first, then to species_aliases.csv. Keep `keys` sorted by key.
# level: species = real species; genus = `<genus>_sp` (genus known, species not);
#        generic = `palm_unknown`. set: socal | florida | other (see palm_genera.yaml).
