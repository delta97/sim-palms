# Test-site registry (TEST-005 skeleton). Validated by tests/sites/sites.schema.json and
# tests/helpers/sites.py. Every site is status: placeholder until TEST-100 (human, sim PC)
# fills in real values. Placeholder coordinates are 0 on purpose: a placeholder site is
# loadable but tools must refuse to run against it. Do not invent coordinates here.
version: 1
sites:
