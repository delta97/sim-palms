    bbox: [0, 0, 0, 0]          # lon_min, lat_min, lon_max, lat_max (TEST-100)
    photogrammetry: true
    inventory_coverage: true
    ground_truth: false
    flight: null
    time_local: "12:00"
    weather: clear
