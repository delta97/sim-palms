name: python

on:
  push:
    branches: [main]
    paths: &paths
      - "palmcore/**"
      - "palmscan/**"
      - "palmgen/**"
      - "schemas/**"
      - "regions/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  pull_request:
    paths: *paths

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,scan,lidar,gen,fx]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,scan,lidar,gen,fx]"
      - run: pytest -m "not network and not sim" --cov=palmcore --cov-report=term-missing --cov-fail-under=85
