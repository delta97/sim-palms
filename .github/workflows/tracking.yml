name: tracking

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate task files
        run: python3 scripts/tasks.py validate
      - name: Board is regenerable
        run: python3 scripts/tasks.py board
