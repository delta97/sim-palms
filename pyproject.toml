[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palmfix"
version = "0.1.0"
description = "Replace MSFS 2024 photogrammetry palm blobs with real 3D palms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
  "numpy>=1.26",
  "scipy>=1.11",
  "shapely>=2.0",
  "lxml>=5.0",
  "pillow>=10.0",
  "scikit-image>=0.22",
  "affine>=2.4",
]
scan = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.7",
  "numpy>=1.26",
  "scipy>=1.11",
  "requests>=2.31",
  "affine>=2.4",
]
lidar = [
  "rasterio>=1.3",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
]
# Needs the native PDAL library; never installed in CI.
pdal = [
  "pdal>=3.4",
]
gen = [
  "lxml>=5.0",
  "jinja2>=3.1",
  "shapely>=2.0",
]

[project.scripts]
palmscan = "palmscan.cli:main"
palmgen = "palmgen.cli:main"
palmfix = "palmcore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["palmcore", "palmscan", "palmgen"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "palmcore/_schemas"

[tool.ruff]
line-length = 100
target-version = "py312"
# scripts/tasks.py is the stdlib-only task CLI, not part of the palmfix packages.
extend-exclude = ["scripts"]

[tool.ruff.format]
# Newer ruff also formats Python code blocks in Markdown; the plans are not linted code.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["palmcore", "palmscan", "palmgen"]
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["palmcore.*"]
strict = true

[[tool.mypy.overrides]]
module = [
  "geopandas.*",
  "pdal.*",
  "rasterio.*",
  "skimage.*",
  "shapely.*",
  "pyproj.*",
  "lxml.*",
  "sklearn.*",
  "scipy.*",
  "pyogrio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = [
  "network: makes live network calls",
  "sim: needs Windows + MSFS 2024 + SDK",
  "slow: takes more than about 10 seconds",
]
